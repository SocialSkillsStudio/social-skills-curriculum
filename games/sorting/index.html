<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Emergency Sorting Game</title>

<link rel="stylesheet" href="../../css/styles.css">

</head>


<body>

<header>

<h1>🚨 Emergency or Not?</h1>

<p>Choose where each situation belongs!</p>

</header>


<main>


<div class="unit-card">

<h2 id="situation">
🔥 A classroom is on fire
</h2>


<button class="button" onclick="answer('emergency')">
🚨 Emergency
</button>


<button class="button" onclick="answer('not')">
🙂 Not an Emergency
</button>


</div>


<h2 id="feedback"></h2>


<div class="unit-card">

<h2>Score: <span id="score">0</span>/6</h2>

</div>


<a class="button" href="../../units/emergencies/blue-group/monday.html">
⬅ Back to Lesson
</a>


</main>



<script>


let questions = [

{
text:"🔥 A classroom is on fire",
answer:"emergency"
},

{
text:"✏️ Your pencil breaks",
answer:"not"
},

{
text:"🚗 A car crashes",
answer:"emergency"
},

{
text:"🧸 You lose your toy",
answer:"not"
},

{
text:"🚑 Someone is badly hurt",
answer:"emergency"
},

{
text:"🍎 You do not like your lunch",
answer:"not"
}

];


let current = 0;

let score = 0;



function answer(choice){


let feedback = document.getElementById("feedback");


if(choice === questions[current].answer){


score++;

document.getElementById("score").innerHTML = score;


feedback.innerHTML = "⭐ Great job!";


}


else{


feedback.innerHTML =
"Try again! Think: Does someone need help right away?";


return;


}



current++;


if(current < questions.length){


document.getElementById("situation").innerHTML =
questions[current].text;


}


else{


document.getElementById("situation").innerHTML =
"🎉 You finished!";


feedback.innerHTML =
"⭐ Emergency Expert Complete!";


}


}


</script>


</body>

</html>
