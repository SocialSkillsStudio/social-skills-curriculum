<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Emergency Sorting Game</title>

<link rel="stylesheet" href="../../css/styles.css">


<style>

.game-area {

text-align:center;
padding:20px;

}


.cards {

display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;

}


.card {

background:white;
padding:20px;
width:200px;
border-radius:20px;
box-shadow:0 5px 10px rgba(0,0,0,.15);

font-size:20px;

cursor:grab;

}


.drop-area {

display:inline-block;

width:300px;

min-height:180px;

margin:20px;

padding:20px;

border-radius:20px;

background:#f4f4f4;

font-size:22px;

}


.correct {

background:#d4edda;

}


.incorrect {

background:#f8d7da;

}


</style>

</head>



<body>


<header>

<h1>🚨 Emergency or Not?</h1>

<p>Drag each card to the correct box!</p>

</header>



<main class="game-area">


<h2>Cards</h2>


<div class="cards">


<div class="card"
draggable="true"
data-answer="emergency">

🔥 A classroom is on fire

</div>


<div class="card"
draggable="true"
data-answer="not">

✏️ Your pencil breaks

</div>


<div class="card"
draggable="true"
data-answer="emergency">

🚗 A car crashes

</div>


<div class="card"
draggable="true"
data-answer="not">

🧸 You lose your toy

</div>


<div class="card"
draggable="true"
data-answer="emergency">

🚑 Someone is badly hurt

</div>


<div class="card"
draggable="true"
data-answer="not">

🍎 You don't like your lunch

</div>


</div>



<h2>Sort Here</h2>


<div class="drop-area" id="emergency">

🚨 EMERGENCY

</div>


<div class="drop-area" id="not">

🙂 NOT AN EMERGENCY

</div>



<h2 id="message"></h2>



<a class="button" href="../../units/emergencies/blue-group/monday.html">
⬅ Back to Lesson
</a>


</main>



<script>


let cards = document.querySelectorAll(".card");


let boxes = document.querySelectorAll(".drop-area");



cards.forEach(card => {


card.addEventListener("dragstart", function(event){

event.dataTransfer.setData(
"text",
card.dataset.answer
);


event.dataTransfer.setData(
"card",
card.innerHTML
);


});


});



boxes.forEach(box => {


box.addEventListener("dragover", function(event){

event.preventDefault();

});



box.addEventListener("drop", function(event){


event.preventDefault();


let answer = event.dataTransfer.getData("text");


let cardText = event.dataTransfer.getData("card");



if(box.id === answer){


box.classList.add("correct");


document.getElementById("message").innerHTML =
"⭐ Great job!";


}


else{


box.classList.add("incorrect");


document.getElementById("message").innerHTML =
"Try again! Think about if someone needs help right away.";

}



});


});


</script>


</body>

</html>
